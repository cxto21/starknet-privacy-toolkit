name: CI

on:
  push:
    branches: [ main, chore/** ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  deps-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          bun -v

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libc++1 build-essential python3.10 python3.10-venv python3.10-dev
          python3.10 -m pip install --user --upgrade pip setuptools wheel

      - name: Install repo dependencies (deps-only)
        run: |
          chmod +x scripts/*.sh || true
          ./scripts/setup.sh

      - name: Verify dependency setup (from DEPENDENCIES)
        run: |
          ./scripts/verify.sh || true
          make install-all

      - name: Toolchain versions
        run: |
          nargo --version || true
          bb --version || true
          scarb --version || true
          sncast --version || true
          python3.10 -m garaga --version || true

      - name: Build Cairo verifier
        run: |
          cd donation_badge_verifier
          scarb --version
          scarb build

      - name: Noir compile and tests (smoke)
        run: |
          cd zk-badges/donation_badge
          nargo compile
          nargo test

      - name: API smoke test
        run: |
          bun install
          (bun run api > /tmp/proof_api.log 2>&1 & echo $! > /tmp/proof_api.pid)
          sleep 3
          curl -s -H "Content-Type: application/json" \
            -d '{"donationamount":"15000","threshold":"10000","donorsecret":"12345","badgetier":"2"}' \
            http://localhost:3001/api/generate-proof | head -c 200
          kill "$(cat /tmp/proof_api.pid)" || true
          tail -n 50 /tmp/proof_api.log || true

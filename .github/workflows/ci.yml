name: CI

on:
  push:
    branches: [ main, chore/** ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  deps-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libc++1 build-essential python3 python3-venv python3-dev
          python3 -m pip install --user --upgrade pip setuptools wheel

      - name: Install repo dependencies (deps-only)
        run: |
          chmod +x scripts/*.sh || true
          export CI=1 NONINTERACTIVE=1 DEBIAN_FRONTEND=noninteractive
          yes "" | ./scripts/setup.sh || ./scripts/setup.sh

      - name: Verify dependency setup (from DEPENDENCIES)
        run: |
          ./scripts/verify.sh || true
          make install-all

      - name: Toolchain versions
        run: |
          nargo --version || true
          bb --version || true
          scarb --version || true
          sncast --version || true
          python3 -c "import garaga, sys; print('garaga', getattr(garaga, '__version__', 'unknown'))" || true

      - name: Build Cairo verifier
        run: |
          cd donation_badge_verifier
          scarb build

      - name: Noir compile and tests (smoke)
        run: |
          cd zk-badges/donation_badge
          nargo compile
          nargo test

name: CI

on:
  push:
    branches: [ main, chore/**, feat/**, fix/** ]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          bun -v

      - name: Install JS dependencies
        run: bun install

      - name: Type-check (tsc)
        run: bun run type-check

      - name: Build (Vite)
        run: bun run build

      - name: CI verify (docs + structure)
        run: bash scripts/ci-verify.sh
